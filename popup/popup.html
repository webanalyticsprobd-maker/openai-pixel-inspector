<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenAI Pixel Helper</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-wrap">
    
    <!-- Top Header -->
    <header class="top-nav">
      <div class="brand">
        <!-- OpenAI Spiral Logo -->
        <svg class="brand-logo" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a10 10 0 0 1 10 10c0 5.52-4.48 10-10 10S2 17.52 2 12 6.48 2 12 2z"/>
          <path d="M12 6a6 6 0 0 1 6 6c0 3.31-2.69 6-6 6s-6-2.69-6-6 2.69-6 6-6z"/>
          <circle cx="12" cy="12" r="2"/>
        </svg>
        <span class="brand-title">OpenAI Pixel Helper</span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btn-theme" title="Toggle Light/Dark Theme">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
        <button class="icon-btn" id="btn-sidepanel" title="Open in Side Panel">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        </button>
        <button class="icon-btn" id="btn-close-window" title="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </header>

    <!-- Context & Control Bar (Image 1) -->
    <section class="context-bar">
      <div class="context-host-row">
        <h2 class="host-name" id="target-host">scanning...</h2>
        <span class="events-count" id="events-count">0 events</span>
      </div>

      <div class="filter-row">
        <input type="text" id="filter-input" class="filter-input" placeholder="Filter by event name or value..." autocomplete="off" />
      </div>

      <div class="controls-row">
        <label class="toggle-label">
          <input type="checkbox" id="chk-clear-reload" checked />
          <span class="toggle-slider"></span>
          <span class="toggle-caption">Clear on reload</span>
        </label>
        <div class="control-links">
          <button class="link-btn" id="btn-clear">Clear</button>
          <button class="link-btn" id="btn-open-tab">Open in tab</button>
          <button class="link-btn" id="btn-debug">Debug</button>
        </div>
      </div>
    </section>

    <!-- Main Live Events List (Image 1 & Image 2) -->
    <main class="events-feed" id="events-feed">
      <div class="empty-feed">
        <div class="empty-spinner"></div>
        <p>Listening for OpenAI Pixel requests...</p>
        <span class="empty-sub">Interact with page or trigger <code>oaiq('measure', ...)</code></span>
      </div>
    </main>

  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
